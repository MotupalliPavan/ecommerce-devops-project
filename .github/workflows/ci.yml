name: Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 289984444906.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check GitHub OIDC token
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          echo "$TOKEN_RESPONSE" | python3 -c '
          import sys
          import json
          import base64

          data = json.load(sys.stdin)
          token = data["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("issuer:", claims.get("iss"))
          print("audience:", claims.get("aud"))
          print("subject:", claims.get("sub"))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::289984444906:role/GitHubActions-EcommerceProject
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsEcommerce
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Build api-gateway
        run: |
          mvn -B -DskipTests package -f api-gateway/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/api-gateway:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/api-gateway:latest" \
            ./api-gateway

      - name: Build email-service
        run: |
          mvn -B -DskipTests package -f email-service/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/email-service:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/email-service:latest" \
            ./email-service

      - name: Build inventory-service
        run: |
          mvn -B -DskipTests package -f inventory-service/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/inventory-service:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/inventory-service:latest" \
            ./inventory-service

      - name: Build order-service
        run: |
          mvn -B -DskipTests package -f order-service/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/order-service:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/order-service:latest" \
            ./order-service

      - name: Build product-service
        run: |
          mvn -B -DskipTests package -f product-service/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/product-service:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/product-service:latest" \
            ./product-service

      - name: Build user-service
        run: |
          mvn -B -DskipTests package -f user-service/pom.xml
          docker build \
            -t "$ECR_REGISTRY/ecommerce/user-service:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/user-service:latest" \
            ./user-service

      - name: Push images to ECR
        run: |
          docker push "$ECR_REGISTRY/ecommerce/api-gateway:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/api-gateway:latest"

          docker push "$ECR_REGISTRY/ecommerce/email-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/email-service:latest"

          docker push "$ECR_REGISTRY/ecommerce/inventory-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/inventory-service:latest"

          docker push "$ECR_REGISTRY/ecommerce/order-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/order-service:latest"

          docker push "$ECR_REGISTRY/ecommerce/product-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/product-service:latest"

          docker push "$ECR_REGISTRY/ecommerce/user-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/user-service:latest"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/ecommerce/frontend:${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/ecommerce/frontend:latest" \
            ./frontend

      - name: Push frontend image to ECR
        run: |
          docker push "$ECR_REGISTRY/ecommerce/frontend:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/ecommerce/frontend:latest"

      - name: Deploy to Kind via AWS SSM
        run: |
          IMAGE_TAG="$GITHUB_SHA"
          REGISTRY="$ECR_REGISTRY/ecommerce"

          cat > deploy.sh <<EOF
          #!/bin/bash
          set -e

          export KUBECONFIG=/home/ubuntu/.kube/config

          REGISTRY="$REGISTRY"
          IMAGE_TAG="$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/api-gateway \
            api-gateway="\$REGISTRY/api-gateway:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/email-service \
            email-service="\$REGISTRY/email-service:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/inventory-service \
            inventory-service="\$REGISTRY/inventory-service:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/order-service \
            order-service="\$REGISTRY/order-service:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/product-service \
            product-service="\$REGISTRY/product-service:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/user-service \
            user-service="\$REGISTRY/user-service:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl set image deployment/frontend \
            frontend="\$REGISTRY/frontend:\$IMAGE_TAG"

          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/api-gateway --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/email-service --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/inventory-service --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/order-service --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/product-service --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/user-service --timeout=180s
          sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/frontend --timeout=180s
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("ssm-parameters.json").write_text(
              json.dumps({
                  "commands": [Path("deploy.sh").read_text()]
              })
          )
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0d6c43657d58bd73a \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0d6c43657d58bd73a \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0d6c43657d58bd73a \
                  --region "$AWS_REGION"

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out"
          exit 1
